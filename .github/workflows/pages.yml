name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Pages 部署需要的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，新的推送会取消旧的
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 准备 Pages（首次会自动开启）
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 打包 docs 目录
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: 发布
        id: deployment
        uses: actions/deploy-pages@v4
