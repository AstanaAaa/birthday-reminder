# Gradle 守护进程的内存，2G 足够编译这个小项目
# -Djava.io.tmpdir 把临时文件指到 D 盘，避免系统临时目录没有写权限
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Djava.io.tmpdir=D:\\XD\\tools\\tmp

# Kotlin 直接在 Gradle 进程里编译，不另起守护进程（更快，也少一个出错点）
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=true

# 使用 AndroidX 库（现代 Android 必须打开）
android.useAndroidX=true

# 使用官方的 Kotlin 代码风格
kotlin.code.style=official

# 非传递性 R 类：编译更快，资源不互相污染
android.nonTransitiveRClass=true

org.gradle.parallel=true
org.gradle.caching=true
