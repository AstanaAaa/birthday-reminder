<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>生日提醒</title>
  <meta name="description" content="录入好友生日，一键写进手机日历，提前一周提醒买礼物。">
  <meta name="theme-color" content="#FFF8F0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="生日提醒">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <!-- 顶部标题栏 -->
    <header class="topbar">
      <button class="icon-btn" id="backBtn" hidden aria-label="返回">←</button>
      <h1 id="title">生日提醒</h1>
      <button class="icon-btn" id="addBtn" aria-label="添加好友">＋</button>
    </header>

    <!-- 页面内容由 app.js 渲染 -->
    <main id="view"></main>
  </div>

  <!-- 导入说明弹层 -->
  <div class="sheet-backdrop" id="sheet" hidden>
    <div class="sheet" role="dialog" aria-modal="true">
      <h2 id="sheetTitle">日历文件已下载</h2>
      <p class="sheet-file" id="sheetFile"></p>
      <ol class="steps" id="sheetSteps"></ol>
      <p class="sheet-note" id="sheetNote"></p>
      <button class="btn btn-ghost" id="sheetShare" hidden>分享到「文件」或「邮件」</button>
      <button class="btn btn-primary" id="sheetClose">知道了</button>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
